services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./server/.env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /app/data/writing_tracker.db
    volumes:
      - sqlite-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlite-data:
